[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    video: marks tests as video generation tests
    database: marks tests as database tests
    storage: marks tests as storage tests
    ai: marks tests as AI service tests
    voice: marks tests as voice synthesis tests
    subtitle: marks tests as subtitle generation tests
    music: marks tests as music service tests
    effects: marks tests as video effects tests
    monitoring: marks tests as monitoring tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
asyncio_mode = auto
